# Nginx Reverse-Proxy für Saubermatik Next.js
# 1. Datei nach /etc/nginx/sites-available/saubermatik kopieren
# 2. Domain ersetzen (server_name)
# 3. Symlink: ln -s /etc/nginx/sites-available/saubermatik /etc/nginx/sites-enabled/
# 4. Test: nginx -t && systemctl reload nginx
# 5. HTTPS später mit certbot --nginx -d www.example.de -d example.de

upstream saubermatik_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.example.de example.de;

    client_max_body_size 10M;

    location / {
        proxy_pass http://saubermatik_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

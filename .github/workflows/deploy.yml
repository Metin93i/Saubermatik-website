name: Deploy to Hostinger VPS

# Deploy nur nach erfolgreichem CI auf main (nicht mehr bei jedem Push allein).
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # Nur bei grünem CI-Lauf — rote/abgebrochene CI-Runs triggern kein Deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            # Erst Code holen (inkl. aktueller ops/deploy.sh), dann Skript ausführen.
            cd /var/www/saubermatik-web
            git fetch origin main
            git reset --hard origin/main
            bash ops/deploy.sh
